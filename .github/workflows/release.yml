name: Build & Release (Windows + macOS)

# - Push to main / manual run → build all platforms, upload as workflow artifacts.
# - Push a tag v*            → build, create GitHub Release with installers + latest.json
#                               (used by the in-app auto-updater).
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ── 1. Create a DRAFT release (tags only) ─────────────────────────────────
  # Draft so users/updaters never see a half-uploaded release.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" \
            -f name="Edukids Screenshot $TAG" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  # ── 2. Build matrix ───────────────────────────────────────────────────────
  build:
    needs: create-release
    # Run on branch pushes too (create-release is skipped there).
    if: ${{ !failure() && !cancelled() }}
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ''
          - name: macos-arm64
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: macos-x64
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # Shipping a release with the placeholder key would leave every install
      # unable to verify future updates — refuse to build a tag in that state.
      - name: Guard updater public key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH' src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is still a placeholder"
            exit 1
          fi

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      # Windows bundles FFmpeg as a sidecar (see src-tauri/tauri.windows.conf.json).
      # Tauri v2 requires the target-triple suffix on externalBin files.
      - name: Download FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -fL -o ffmpeg-release.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          7z x -y ffmpeg-release.zip > /dev/null
          cp ffmpeg-*-essentials_build/bin/ffmpeg.exe src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - name: Build (and upload to release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key — generate with `yarn tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edukids-screenshot-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

  # ── 3. Publish the release once every platform succeeded ─────────────────
  publish-release:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false -F prerelease=false -f make_latest=true
