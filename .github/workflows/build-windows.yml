name: Build Windows

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  workflow_dispatch:   # allow manual trigger from Actions UI

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install Node dependencies
        run: yarn install

      # ── Download FFmpeg Asset ───────────────────────────────────────────────
      - name: Download FFmpeg (Windows)
        run: |
          mkdir -p src-tauri/binaries
          curl -L -o ffmpeg-release.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          7z x ffmpeg-release.zip
          cp ffmpeg-*-essentials_build/bin/ffmpeg.exe src-tauri/binaries/ffmpeg.exe
        shell: bash

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build Tauri app (Windows)
        run: yarn build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''   # leave empty for unsigned dev builds

      # ── Upload artifacts ─────────────────────────────────────────────────────
      - name: Upload Windows installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: edukids-screenshot-windows-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

      # Bước upload file .exe và ffmpeg.exe lên GitHub Releases 
      - name: Create Release and Upload GitHub Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/binaries/ffmpeg.exe
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
